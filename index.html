<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#44700c">

    <title>mewzah</title>
    <meta name="description" content="mewzah's dashboard">
    <meta property="og:title" content="mewzah">
    <meta property="og:description" content="living in a long forgotten world">
    <meta property="og:type" content="profile">
    <meta property="og:image" content="assets/gamerpic.png">

    <link rel="icon" href="assets/gamerpic.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="sr">mewzah</h1>
    <canvas id="bg" aria-hidden="true"></canvas>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="glyph-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset=".5" stop-color="#f1f5e8"/>
                <stop offset=".53" stop-color="#e2f09c"/>
                <stop offset="1" stop-color="#c3e430"/>
            </linearGradient>
        </defs>
    </svg>

    <div id="stage">
        <nav id="channels" aria-label="Channels"></nav>
        <div id="rows"></div>
        <p id="count"></p>

        <section id="screen" aria-hidden="true">
            <p class="crumb"></p>
            <h2 class="title"></h2>
            <div class="body"></div>
        </section>

        <div id="gamercard">
            <div class="tr-text">
                <p class="tr-name"></p>
                <p class="tr-score"></p>
            </div>
            <img class="tr-pic" alt="">
        </div>

        <footer id="legend"></footer>

        <div id="orb" aria-hidden="true"></div>
        <div id="toast" role="status"><i></i><span></span></div>
    </div>

    <p id="sr" class="sr" aria-live="polite"></p>
    <audio id="song" src="assets/song.mp3" preload="metadata"></audio>

    <noscript>
        <style>#stage { display: none; }</style>
        <ul class="nojs">
            <li><a href="https://www.youtube.com/@mewzah">YouTube</a></li>
            <li><a href="https://www.twitch.tv/mewzah">Twitch</a></li>
            <li><a href="https://www.tiktok.com/@mewzah">TikTok</a></li>
            <li><a href="https://x.com/mewzah">X</a></li>
            <li>Discord: mewzah</li>
        </ul>
    </noscript>

    <script src="app.js"></script>
</body>
</html>
