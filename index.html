    <script>
        (() => {
            const toast = document.querySelector('.toast');
            let hideToast;
            document.querySelectorAll('[data-copy]').forEach((btn) => {
                btn.addEventListener('click', async () => {
                    const text = btn.dataset.copy;
                    try {
                        await navigator.clipboard.writeText(text);
                        toast.textContent = `discord username copied: ${text}`;
                    } catch {
                        toast.textContent = `discord: ${text}`;
                    }
                    toast.classList.add('show');
                    clearTimeout(hideToast);
                    hideToast = setTimeout(() => toast.classList.remove('show'), 2200);
                });
            });

            const player = document.querySelector('.player');
            const audio = player.querySelector('audio');
            const play = player.querySelector('.play');
            const seek = player.querySelector('.seek');
            const cur = player.querySelector('.cur');
            const dur = player.querySelector('.dur');
            const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
            const paint = () => seek.style.setProperty('--p', `${seek.value}%`);

            audio.addEventListener('loadedmetadata', () => {
                dur.textContent = fmt(audio.duration);
                player.hidden = false;
            });
            audio.addEventListener('timeupdate', () => {
                cur.textContent = fmt(audio.currentTime);
                seek.value = (audio.currentTime / audio.duration) * 100 || 0;
                paint();
            });
            audio.addEventListener('play', () => { player.classList.add('playing'); play.setAttribute('aria-label', 'Pause'); });
            audio.addEventListener('pause', () => { player.classList.remove('playing'); play.setAttribute('aria-label', 'Play'); });
            play.addEventListener('click', () => (audio.paused ? audio.play() : audio.pause()));
            seek.addEventListener('input', () => {
                audio.currentTime = (seek.value / 100) * audio.duration;
                paint();
            });
        })();
    </script>
