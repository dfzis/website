<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#44700c">
    <title>Content unavailable · mewzah</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <script>
        // match the theme picked on the dashboard
        try { document.documentElement.dataset.theme = localStorage.getItem('mz.theme') || 'green'; } catch (e) { /* no storage */ }
    </script>
    <style>
        @font-face {
            font-family: "Barlow";
            font-weight: 400;
            font-display: swap;
            src: url("/assets/fonts/barlow-400-latin.woff2") format("woff2");
        }
        @font-face {
            font-family: "Barlow";
            font-weight: 600;
            font-display: swap;
            src: url("/assets/fonts/barlow-600-latin.woff2") format("woff2");
        }
        :root {
            --s0: #264203; --s1: #44700c; --s2: #6b9a20; --s3: #a3bf78; --s4: #d3e2c3;
            --l0: #eef3a2; --l1: #cfe64c; --l2: #a9cd1f; --l3: #86b313; --l4: #5d860d; --l5: #3a5507;
            --glow: rgba(200, 255, 80, .45);
        }
        [data-theme="blue"] {
            --s0: #024051; --s1: #0b6c87; --s2: #2197b4; --s3: #85bac7; --s4: #c9dfe6;
            --l0: #b8f6f8; --l1: #76e6ef; --l2: #34d3e5; --l3: #11b7d2; --l4: #0c869f; --l5: #065566;
            --glow: rgba(80, 220, 255, .45);
        }
        [data-theme="purple"] {
            --s0: #2d0a52; --s1: #4b1a86; --s2: #7a4cb8; --s3: #b69cd2; --s4: #dfd2ea;
            --l0: #e0d3fa; --l1: #c3a7f5; --l2: #a97dee; --l3: #9159e8; --l4: #6c32c4; --l5: #45188a;
            --glow: rgba(190, 140, 255, .45);
        }
        [data-theme="orange"] {
            --s0: #602802; --s1: #9d470d; --s2: #d26727; --s3: #cca68f; --s4: #e7d7cb;
            --l0: #fad8cf; --l1: #f4b39c; --l2: #ec8e69; --l3: #ee7236; --l4: #cb510f; --l5: #813308;
            --glow: rgba(255, 150, 80, .45);
        }
        [data-theme="halloween"] {
            --s0: #12031f; --s1: #2d0b4e; --s2: #6a1f6e; --s3: #d4561f; --s4: #f59a3c;
            --l0: #fad8cf; --l1: #f4b39c; --l2: #ec8e69; --l3: #ee7236; --l4: #cb510f; --l5: #813308;
            --glow: rgba(255, 150, 80, .45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            display: grid;
            place-items: center;
            padding: 16px;
            overflow: hidden;
            font-family: "Convection", "Barlow", "Segoe UI", system-ui, sans-serif;
            color: #fff;
            background:
                radial-gradient(150% 60% at 50% 112%, #e3e7ea 0%, #bcc3ca 18%, #8f979e 40%, #656c72 70%, transparent 71%),
                linear-gradient(180deg, var(--s0) 0%, var(--s1) 22%, var(--s2) 44%, var(--s3) 66%, var(--s4) 84%, #f3f6f2 100%);
        }
        .box {
            width: min(560px, 100%);
            padding: 30px 30px 24px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(78, 82, 86, .95), rgba(38, 41, 44, .95) 40%, rgba(20, 22, 24, .95));
            border: 1px solid rgba(255, 255, 255, .28);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .25);
            text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
        }
        .head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .icon {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 32px;
            font-weight: 600;
            background: radial-gradient(circle at 38% 30%, #fff 0, #cfcfcf 40%, #7c7c7c 100%);
            color: #2a2a2a;
            text-shadow: none;
            box-shadow: 0 0 0 4px #141414, 0 0 0 7px var(--l3), 0 4px 12px rgba(0, 0, 0, .5);
        }
        h1 { font-size: 30px; font-weight: 600; line-height: 1.1; }
        p { font-size: 19px; line-height: 1.4; opacity: .9; }
        .code { margin-top: 8px; font-size: 15px; opacity: .6; }
        .btn {
            display: flex;
            align-items: center;
            margin-top: 22px;
            height: 54px;
            padding: 0 20px;
            border-radius: 5px;
            font-size: 21px;
            color: #fff;
            text-decoration: none;
            background:
                radial-gradient(130% 55% at 70% -5%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 60%),
                linear-gradient(180deg, var(--l0) 0%, var(--l1) 16%, var(--l2) 46%, var(--l3) 68%, var(--l4) 84%, var(--l5) 100%);
            border: 1px solid rgba(255, 255, 220, .85);
            box-shadow: 0 0 18px var(--glow);
        }
        .legend { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 17px; opacity: .9; }
        .pad {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 600;
            background: radial-gradient(circle at 35% 28%, #d6f7a0, #5aa818 55%, #2f6a08);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .5);
        }
    </style>
</head>
<body>
    <main class="box" role="alertdialog" aria-labelledby="t" aria-describedby="d">
        <div class="head">
            <span class="icon" aria-hidden="true">!</span>
            <h1 id="t">Content unavailable</h1>
        </div>
        <p id="d">This page isn't available. It may have been moved or removed, or the link may be wrong.</p>
        <p class="code">Status code: 404</p>
        <a class="btn" href="/" autofocus>Return to Dashboard</a>
        <p class="legend"><span class="pad" aria-hidden="true">A</span>Select</p>
    </main>
    <script>
        // A / Enter / Space (or a controller's A) goes back to the dashboard
        const home = () => { location.href = '/'; };
        addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'a' || e.key === 'A' || e.key === 'Escape') home();
        });
        (function poll() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (const g of pads) if (g && g.buttons[0] && g.buttons[0].pressed) return home();
            requestAnimationFrame(poll);
        })();
    </script>
</body>
</html>
